<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Caderno de arquitetura de software</title><desc id="desc">Uma mesa de trabalho em tons de café, com notebook exibindo um diagrama de sistema, caderno de desenho e luz quente de fim de tarde.</desc>
