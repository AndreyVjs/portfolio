<path d="M0 785H1400" stroke="#B47B52" stroke-opacity=".28"/><text x="65" y="69" fill="#D7B18B" font-family="monospace" font-size="13" letter-spacing="4">ANDREY VINICIUS  /  CADERNO DE DESENVOLVIMENTO</text><text x="65" y="735" fill="#F7E8D6" font-family="Georgia,serif" font-size="44">Organize the idea.</text><text x="65" y="785" fill="#D7B18B" font-family="Georgia,serif" font-style="italic" font-size="38">Then write the code.</text>
